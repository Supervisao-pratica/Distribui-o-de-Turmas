<script>
      // Altere para false quando quiser voltar a usar Firebase.
      window.SGT_LOCAL_TEST_MODE = false;
      window.sgtFirebaseError = null;
      window.sgtFirebaseReady = new Promise((resolve, reject) => {
        window.sgtResolveFirebaseReady = resolve;
        window.sgtRejectFirebaseReady = reject;
      });
    </script>
<script type="module">
      // MODO TESTE LOCAL:
      // true  = não importa Firebase, não lê nuvem e não grava nuvem.
      // false = volta a usar Firebase normalmente.
      const LOCAL_TEST_MODE = window.SGT_LOCAL_TEST_MODE === true;

      const sgtFirebaseBoot = (async () => {
        if (LOCAL_TEST_MODE) {
          window.remoteDB = null;
          window.dbMethods = null;
          window.auth = null;
          window.authMethods = {
            signInWithEmailAndPassword: async () => ({ user: { email: "modo-teste-local@senac.local", localMode: true } }),
            onAuthStateChanged: (_auth, callback) => {
              setTimeout(() => callback({ email: "modo-teste-local@senac.local", localMode: true }), 0);
              return () => {};
            },
            signOut: async () => {
              console.log("Modo teste local ativo: logout Firebase ignorado.");
            }
          };
          return { localMode: true };
        }

        try {
          const [
            { initializeApp },
            firestoreModule,
            authModule
          ] = await Promise.all([
            import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),
            import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js"),
            import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js")
          ]);

          const { initializeFirestore, memoryLocalCache, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, setDoc, writeBatch, onSnapshot, getDoc, waitForPendingWrites } = firestoreModule;
          const { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } = authModule;

          const firebaseConfig = {
            apiKey: "AIzaSyAdjsftZXsQ00waKGsLDeY7lDqRgeU_DnM",
            authDomain: "sgt-senac.firebaseapp.com",
            projectId: "sgt-senac",
            storageBucket: "sgt-senac.firebasestorage.app",
            messagingSenderId: "278613531988",
            appId: "1:278613531988:web:51af3366f7199c274b3cc1"
          };

          const app = initializeApp(firebaseConfig);
          const db = initializeFirestore(app, { localCache: memoryLocalCache(), experimentalAutoDetectLongPolling: true });
          const auth = getAuth(app);

          window.remoteDB = db;
          window.dbMethods = {
            collection, getDocs, addDoc, updateDoc, deleteDoc, doc, setDoc, writeBatch, onSnapshot, getDoc, waitForPendingWrites
          };

          window.auth = auth;
          window.authMethods = {
            signInWithEmailAndPassword, onAuthStateChanged, signOut
          };

          return { localMode: false, app, db, auth };
        } catch (error) {
          window.sgtFirebaseError = error;
          console.error("Falha ao inicializar Firebase:", error);
          throw error;
        }
      })();

      sgtFirebaseBoot
        .then((result) => {
          if (typeof window.sgtResolveFirebaseReady === 'function') window.sgtResolveFirebaseReady(result);
        })
        .catch((error) => {
          if (typeof window.sgtRejectFirebaseReady === 'function') window.sgtRejectFirebaseReady(error);
        });

      window.sgtFirebaseReady = sgtFirebaseBoot;
    </script>

    <script type="text/babel">
        const safeString = (val) => {
            if (val === null || val === undefined) return "";
            if (typeof val === 'object') return ""; 
            return String(val);
        };

        const { useState, useEffect, useMemo, useRef, Component } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell } = Recharts;

        // --- COMPONENTE DE TELA DE LOGIN ---
        const LoginScreen = () => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            
           
            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');
                try {
                    if (window.sgtFirebaseReady && typeof window.sgtFirebaseReady.then === 'function') {
                        await window.sgtFirebaseReady;
                    }
                    if (!window.auth || !window.authMethods || !window.authMethods.signInWithEmailAndPassword) {
                        throw new Error('Firebase Auth ainda não está pronto.');
                    }
                    await window.authMethods.signInWithEmailAndPassword(window.auth, email.trim(), password);
                } catch (err) {
                    console.error(err);
                    const code = safeString(err && (err.code || err.message));
                    if (code.includes('auth/unauthorized-domain')) {
                        setError('Domínio do GitHub não autorizado no Firebase Authentication.');
                    } else if (code.includes('auth/invalid-credential') || code.includes('auth/wrong-password') || code.includes('auth/user-not-found')) {
                        setError('Acesso negado. Verifique se o e-mail e a senha estão corretos.');
                    } else {
                        setError(`Falha no login: ${code || 'Firebase não respondeu.'}`);
                    }
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-200">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">🔒</div>
                            <h2 className="text-2xl font-bold text-slate-800">Portal da Supervisão</h2>
                            <p className="text-sm text-slate-500 mt-2">Acesso restrito à equipe pedagógica.</p>
                        </div>
                        {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-200 font-bold text-center">{error}</div>}
                        <form onSubmit={handleLogin} className="flex flex-col gap-4">
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-1">E-mail Cadastrado</label>
                                <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required placeholder="seu.email@pr.senac.br" />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-1">Senha</label>
                                <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required placeholder="••••••••" />
                            </div>
                            <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-lg mt-2 transition flex justify-center items-center shadow-md">
                                {loading ? 'Verificando...' : 'Entrar no Sistema'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- ESTRUTURA DOS LEQUES DE CURSOS (APZ) ---
        const CURSOS_POR_MODALIDADE = {
            'Aperfeiçoamento': ['Administrativo', 'Administrativo (Sescoop)', 'Vendas', 'Supermercado'],
            'Técnica': ['Administrativo', 'ADM Sescoop']
        };

        const INITIAL_DB = [];

        const getSafeModalidade = (row) => {
            if (row.modalidade) {
                return normalizeText(row.modalidade).includes('tecnica') ? 'Técnica' : 'Aperfeiçoamento';
            }
            const cNorm = normalizeText(row.curso);
            if (cNorm.includes('tecnica') || cNorm.includes('empresas')) return 'Técnica';
            return 'Aperfeiçoamento';
        };

        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false, message: '' }; }
            static getDerivedStateFromError(error) { return { hasError: true, message: safeString(error && error.message) }; }
            componentDidCatch(error, errorInfo) { console.error("Crash UI:", error, errorInfo); }
            handleReset = () => { window.location.reload(); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="flex flex-col items-center justify-center min-h-screen bg-gray-50 p-4 text-center">
                            <h2 className="text-xl font-bold text-slate-800 mb-2">Sistema Indisponível</h2>
                            <p className="text-gray-500 mb-2 text-sm">Ocorreu um erro ao carregar os dados. Tente reiniciar.</p>{this.state.message && <div className="mb-4 max-w-2xl text-left text-xs font-mono text-red-700 bg-red-50 border border-red-200 rounded-lg p-3 select-text">Detalhe técnico: {this.state.message}</div>}
                            <button onClick={this.handleReset} className="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-bold shadow hover:bg-blue-700 transition">Reiniciar Aplicação</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

            Upload: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4-4m0 0L8 8m4-4v12" /></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" /></svg>,
            Switch: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" /></svg>,
            Maximize: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>,
             Refresh: () => <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,
             ArrowRight: ({ className = 'w-4 h-4' }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 5l7 7-7 7M5 12h14" /></svg>,
            Check: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" /></svg>,
            FileText: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>,
            Download: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4-4m0 0l-4-4m4 4V4" /></svg>,

            Alert: () => <svg className="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>,
            Save: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>,

        };

        const DB_KEY = 'senacData_v45'; 
        const SUB_KEY = 'senacSubs_v45';
        const LOG_KEY = 'senacLogs_v65';
        const BLOCK_KEY = 'senacBlockedInstructors_v1';
        const EXTRA_INSTRUCTORS_KEY = 'senacExtraInstructors_v1';
        const LAST_REBALANCE_KEY = 'senacLastRebalanceAt_v1';
        const TURMAS_COLLECTION = 'sgt_turmas';
        const LOCAL_SYNC_KEY = 'sgtLocalSyncState_v119';
        const LOCAL_BACKUPS_KEY = 'sgtLocalBackups_v119';
        const canonicalClassId = (value) => safeString(value)
            .replace(/[\u00A0\u2007\u202F\u200B-\u200D\uFEFF]/g, ' ')
            .replace(/\s+/g, ' ').trim();
        const classCloudId = (row) => encodeURIComponent(canonicalClassId(row && (row.id || row.turma || row.codigo || row.cloudId))).slice(0,1400);
        const rowTimestamp = (row) => Date.parse(row && (row._localUpdatedAt || row._cloudUpdatedAt || row.lastUpdate) || 0) || 0;
        const cleanComparable = (row) => { const x={...(row||{})}; delete x._pendingWrites; delete x._cloudUpdatedAt; delete x._cloudUpdatedBy; delete x.cloudId; return JSON.stringify(x, Object.keys(x).sort()); };
        const dedupeClasses = (rows) => {
            const unique = new Map();
            (Array.isArray(rows) ? rows : []).forEach((raw,index) => {
                if (!raw || typeof raw !== 'object') return;
                const id=canonicalClassId(raw.id || raw.turma || raw.codigo || raw.cloudId);
                if (!id) return;
                const row={...raw,id,cloudId:encodeURIComponent(id).slice(0,1400)};
                const previous=unique.get(id);
                if (!previous || rowTimestamp(row)>=rowTimestamp(previous.row) || index>previous.index) unique.set(id,{row,index});
            });
            return [...unique.values()].map(item=>item.row);
        };
        const readLocalRows = () => { try { const r=JSON.parse(localStorage.getItem(DB_KEY)||'[]'); return dedupeClasses(r); } catch { return []; } };
        const saveLocalSnapshot = (payload) => {
            try { const old=JSON.parse(localStorage.getItem(LOCAL_BACKUPS_KEY)||'[]'); localStorage.setItem(LOCAL_BACKUPS_KEY, JSON.stringify([{...payload, id: payload.backupId}, ...(Array.isArray(old)?old:[])].slice(0,50))); } catch(e) { console.error('Backup local:',e); }

        // Whitelist Técnica
        const TECNICA_WHITELIST = ['juliana', 'viviane', 'ana claudia', 'jean', 'tatiane', 'katia'];

        const normalizeText = (text) => {
            if (!text || typeof text !== 'string') return "";
            return text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
        };

        const normalizeAutoAssignedLogs = (logs) => {
            if (!logs) return undefined;
            if (typeof logs === 'object' && !Array.isArray(logs)) return logs;
            if (typeof logs !== 'string') return undefined;

        const formatDatePTBR = (iso) => { const s = safeString(iso); if(!s) return ''; const p = s.split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : s; };

            // === SALVA SEMPRE NO COMPUTADOR E NA NUVEM, POR TURMA ===

                    const subs=Array.isArray(newSubs)?newSubs:[]; const nextLogs=Array.isArray(newLogs)?newLogs:logs;
                    const payload={data:rows,logs:nextLogs,substitutions:subs,blockedInstructors:blocked,extraInstructors,backupId,lastUpdate:now,updatedBy:safeString(user&&user.email)};
                    setIsSaving(true);setSyncStatus(navigator.onLine?'saving':'pending');setData(rows);setLogs(nextLogs);setSubstitutions(subs);
                    localStorage.setItem(DB_KEY,JSON.stringify(rows));localStorage.setItem(LOG_KEY,JSON.stringify(nextLogs));localStorage.setItem(SUB_KEY,JSON.stringify(subs));localStorage.setItem(BLOCK_KEY,JSON.stringify(blocked));saveLocalSnapshot(payload);
                    if(LOCAL_TEST_MODE){setIsSaving(false);return true;}
                    if(!window.remoteDB||!window.auth||!window.auth.currentUser)throw new Error('Firebase ou autenticação indisponível');
                    const {doc,writeBatch}=window.dbMethods; const cloud=cloudRowsRef.current;const next=new Map(rows.map(r=>[r.cloudId,r]));const changes=[];
                    next.forEach((r,id)=>{const old=cloud.get(id);if(!old||cleanComparable(old)!==cleanComparable(r))changes.push({type:'set',id,row:r});}); cloud.forEach((r,id)=>{if(!next.has(id))changes.push({type:'delete',id});});
                    for(let i=0;i<changes.length;i+=400){const b=writeBatch(window.remoteDB);changes.slice(i,i+400).forEach(c=>{const ref=doc(window.remoteDB,TURMAS_COLLECTION,c.id);c.type==='delete'?b.delete(ref):b.set(ref,{...c.row,_cloudUpdatedAt:now,_cloudUpdatedBy:safeString(user&&user.email)},{merge:true});});await b.commit();}
                    const b=writeBatch(window.remoteDB);b.set(doc(window.remoteDB,'sgt','metadados'),{logs:nextLogs,substitutions:subs,blockedInstructors:blocked,extraInstructors,lastUpdate:now,updatedBy:safeString(user&&user.email)},{merge:true});b.set(doc(window.remoteDB,'sgt_backups',backupId),{...payload,backupType:'per-class',createdAt:now,changedClassDocuments:changes.length});await b.commit();
                    if(navigator.onLine&&window.dbMethods.waitForPendingWrites)await window.dbMethods.waitForPendingWrites(window.remoteDB);

                saveQueueRef.current=saveQueueRef.current.then(job,job).catch(e=>{console.error('Sincronização:',e);setIsSaving(false);setSyncStatus('error');showNotify(`Salvo no computador; nuvem pendente (${e.code||e.message})`,'error');return false;});return saveQueueRef.current;

            const restoreBackupPrompt = async () => {

                const all=new Map();[...(Array.isArray(local)?local:[]),...cloud].forEach(b=>all.set(b.backupId||b.id,b));

// --- INÍCIO DO PASSO 2: FUNÇÃO PARA EXCLUIR TURMA ---

            // --- FIM DO PASSO 2 ---

            const canonicalNameMap = useMemo(() => {

            const sanitizeName = (val) => {
                if (!val) return '';
                const s = safeString(val).trim();
                if (s.toLowerCase() === 'não atribuido' || s.toLowerCase() === 'nao atribuido' || s === '-' || s === '0') return '';
                return s;
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const wb = XLSX.read(evt.target.result, { type: 'array', cellDates: true });
                        
                        if (wb.SheetNames.includes("Turmas_DB") || wb.SheetNames.includes("Subs_DB")) {
                            let importedClasses = 0; let importedSubs = 0;
                            let newDB = [...data];
                            let newSubsDB = [...substitutions];
                            let newLogsDB = [...logs];
                            let cleanImportLog = null;
                            let cleanImportSummary = null;

                            if (wb.SheetNames.includes("Turmas_DB")) { 
                                const ws = wb.Sheets["Turmas_DB"]; 
                                const jsonData = XLSX.utils.sheet_to_json(ws); 
                                newDB = dedupeClasses(jsonData.map(row => ({
                                    id: safeString(row['Turma'] || row['id']),
                                    modalidade: safeString(row['APZ'] || row['modalidade'] || 'Aperfeiçoamento'),
                                    curso: safeString(row['Curso'] || row['curso'] || 'Administrativo'),
                                    analista: safeString(row['Analistas'] || row['analista']),
                                    alunos: parseInt(row['Alunos'] || row['alunos']) || 0,
                                    inicio: fmtDate(row['Início'] || row['inicio']),
                                    termino: fmtDate(row['Término'] || row['termino']),
                                    dataTransferencia: fmtDate(row['Passagem 1'] || row['dataTransferencia']),
                                    dataTransferencia2: fmtDate(row['Passagem 2'] || row['dataTransferencia2']),
                                    instrutor1: safeString(row['Instrutor 1'] || row['instrutor1']),
                                    instrutor2: safeString(row['Instrutor 2'] || row['instrutor2']),
                                    instrutor3: safeString(row['Instrutor 3'] || row['instrutor3']),
                                    instrutorAtual: safeString(row['Instrutor Atual'] || row['instrutorAtual']),
                                    status: safeString(row['Situação'] || row['status']),
                                    
                                })));
                                importedClasses = newDB.length; 
                            }
                            if (wb.SheetNames.includes("Subs_DB")) { 
                                const ws = wb.Sheets["Subs_DB"]; 
                                newSubsDB = XLSX.utils.sheet_to_json(ws); 
                                importedSubs = newSubsDB.length; 
                            }
                            if (wb.SheetNames.includes("Logs_DB")) { 
                                const ws = wb.Sheets["Logs_DB"]; 
                                newLogsDB = XLSX.utils.sheet_to_json(ws); 
                            }
                            if (cleanImportLog) {
                                newLogsDB = [cleanImportLog, ...newLogsDB];
                            }
                            
                            const saved = await persist(newDB, newSubsDB, newLogsDB);
                            if (cleanImportSummary) {
                                setImportSummaryModal(cleanImportSummary);
                            }
                            showNotify(saved ? `Importação concluída e salva automaticamente no computador e na nuvem: ${importedClasses} turma(s).` : `Importação salva no computador. A nuvem será atualizada automaticamente quando a conexão voltar.`, saved ? 'success' : 'error');
                            return;
                        }

                        showNotify('Formato não reconhecido. Use o backup completo do S.G.T.', 'error');
                    } catch (err) { showNotify("Erro ao ler arquivo. Verifique se é um Excel válido.", "error"); }
                };
                reader.readAsArrayBuffer(file); e.target.value = null;
            };

            const handleCreateClass = (e) => { 
                e.preventDefault();
                const cleanId=canonicalClassId(newClass.id);
                if(!cleanId) return showNotify('Informe o número da turma.','error');
                if(data.some(row=>canonicalClassId(row.id)===cleanId)) return showNotify('Já existe uma turma com este número. Nenhum dado foi alterado.','error');
                const resultItem={...newClass,id:cleanId,alunos:parseInt(newClass.alunos)||0};
                const autoAssigned={};
                const duplicateInstructor = getDuplicateInstructorInClass(resultItem);
                if (duplicateInstructor) {
                    showNotify("Erro: o mesmo instrutor não pode ser Instrutor 1, 2 ou 3 na mesma turma.", "error");
                    return;
                }
                const newLogs = addLog("Criação", resultItem.id, "Inexistente", `Criada: ${resultItem.curso} (${resultItem.alunos} alunos) [${resultItem.modalidade}]`);
                
                const existingIdx = data.findIndex(d => String(d.id) === String(resultItem.id));
                let newData = [...data];
                if (existingIdx >= 0) {
                    newData[existingIdx] = resultItem;
                } else {
                    newData.push(resultItem);
                }

                persist(newData, substitutions, newLogs); 
                setIsFormOpen(false); 
                setNewClass({ id: '', modalidade: 'Aperfeiçoamento', curso: 'Administrativo', analista: '', alunos: '', inicio: '', termino: '', instrutor1: '', instrutor2: '', instrutor3: '', dataTransferencia: '', dataTransferencia2: '' }); 
                
                if (Object.keys(autoAssigned).length > 0) {
                    setImportSummaryModal([{ turmaId: resultItem.id, curso: resultItem.curso, modalidade: resultItem.modalidade, isNewClass: existingIdx < 0, changes: autoAssigned }]);
                } else {
                    showNotify("Turma salva com sucesso!");
                }
            };
            
            const handleCreateSub = (e) => { 
                e.preventDefault(); 
                if (newSub.isDefinitive) {
                    const newData = data.map(d => {
                        if (String(d.id) === String(newSub.turmaId)) {
                            const updated = { ...d };
                            if (updated.instrutor1 === newSub.instrutorAusente) updated.instrutor1 = newSub.instrutorSubstituto;
                            if (updated.instrutor2 === newSub.instrutorAusente) updated.instrutor2 = newSub.instrutorSubstituto;
                            if (updated.instrutor3 === newSub.instrutorAusente) updated.instrutor3 = newSub.instrutorSubstituto;
                            return updated;
                        }
                        return d;
                    });
                    const newLogs = addLog("Transferência Definitiva", newSub.turmaId, newSub.instrutorAusente, newSub.instrutorSubstituto);
                    persist(newData, substitutions, newLogs);
                    showNotify(`Transferência Definitiva realizada com sucesso!`);
                } else {
                    persist(data, [...substitutions, { ...newSub, id: Date.now() }], logs); 
                    showNotify(`Cobertura Temporária registrada com sucesso!`);
                }
                setIsSubModalOpen(false); 
                setNewSub({ isDefinitive: false, dataInicio: '', dataFim: '', turmaId: '', instrutorAusente: '', instrutorSubstituto: '', motivo: '' }); 
            };
            
            const ClassChain = ({ cls, currentInst }) => {
                const cInst = getCanonical(currentInst);
                const isTecnica = cls.modalidade === 'Técnica';
                const getRoleLog = (role) => {
                    if (!cls.autoAssignedLogs || typeof cls.autoAssignedLogs !== 'object') return null;
                    return cls.autoAssignedLogs[role] || null;
                };
                const renderInstructorStep = (role, label, colorClass, activeColorClass) => {
                    const roleLog = getRoleLog(role);
                    const isActive = getCanonical(cls[role]) === cInst;
                    const isPreserved = roleLog && roleLog.type === 'preserved-current';
                    const isBlockedRedistribution = roleLog && roleLog.type === 'blocked-redistribution';
                    const badge = roleLog ? (isPreserved ? 'Atual' : (isBlockedRedistribution ? 'Bloq.' : 'IA')) : '';
                    const badgeClass = isPreserved
                        ? 'bg-blue-100 text-blue-700 border-blue-200'
                        : (isBlockedRedistribution
                            ? 'bg-red-100 text-red-700 border-red-200'
                            : 'bg-purple-100 text-purple-700 border-purple-200');
                    const title = roleLog && roleLog.reason ? `${label}: ${roleLog.reason}` : label;

                    return (
                        <span className={`px-1.5 py-0.5 rounded border flex items-center gap-1 ${isActive ? activeColorClass : colorClass}`} title={title}>
                            <span>{cls[role] || 'A Definir'}</span>
                            {badge && <span className={`text-[8px] leading-none px-1 py-0.5 rounded border font-black ${badgeClass}`}>{badge}</span>}
                        </span>
                    );
                };
                
                return (
                    <div className="mt-2 pt-2 border-t border-slate-100 flex flex-col gap-1 w-full bg-slate-50 p-2 rounded-lg">
                        <span className="text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-1">Cadeia Docente:</span>
                        <div className="flex items-center flex-wrap gap-x-1 gap-y-1 text-[10px] font-bold">
                            {renderInstructorStep('instrutor1', 'Instrutor 1 (Início)', 'bg-white text-slate-600 border-slate-300', 'bg-blue-600 text-white border-blue-700')}
                            
                            <span className="text-slate-300 text-[8px] font-black">➔</span>
                            {renderInstructorStep('instrutor2', 'Instrutor 2 (Passagem 1)', 'bg-white text-slate-600 border-slate-300', 'bg-green-600 text-white border-green-700 shadow')}
                            
                            {(isTecnica || cls.instrutor3) && (
                                <>
                                    <span className="text-slate-300 text-[8px] font-black">➔</span>
                                    {renderInstructorStep('instrutor3', 'Instrutor 3 (Passagem 2)', 'bg-white text-slate-600 border-slate-300', 'bg-purple-600 text-white border-purple-700 shadow')}
                                </>
                            )}
                        </div>
                    </div>
                )
            };

            const getRoleSignalLog = (row, role) => {
                const logs = normalizeAutoAssignedLogs(row.autoAssignedLogs);
                return logs && logs[role] ? logs[role] : null;
            };

            const SignalBadge = ({ log }) => {
                if (!log) return null;

                const type = typeof log === 'object' ? log.type : '';
                const reason = typeof log === 'object' ? log.reason : 'Preenchido automaticamente pelo sistema.';
                const label = type === 'preserved-current'
                    ? 'Atual'
                    : (type === 'blocked-redistribution'
                        ? 'Bloq.'
                        : (type === 'rebalance-future' ? 'Ajuste IA' : 'IA'));
                const badgeClass = type === 'preserved-current'
                    ? 'bg-blue-100 text-blue-700 border-blue-200'
                    : (type === 'blocked-redistribution'
                        ? 'bg-red-100 text-red-700 border-red-200'
                        : 'bg-purple-100 text-purple-700 border-purple-200');

                return <span title={reason} className={`text-[8px] leading-none px-1 py-0.5 rounded border font-black ${badgeClass}`}>{label}</span>;
            };

            const getOrganizedInstructorData = (instructorName, referenceDate = null) => {
                const fullProfile = globalInstructorStats[instructorName];
                if (!fullProfile) return null;

                const allInvolvedClasses = data.filter(d => getCanonical(d.instrutor1) === instructorName || getCanonical(d.instrutor2) === instructorName || getCanonical(d.instrutor3) === instructorName); 
                const target = referenceDate instanceof Date
                    ? new Date(referenceDate.getTime())
                    : new Date(viewDate + 'T00:00:00');
                target.setHours(0, 0, 0, 0);
                const activeClasses = []; const incomingClasses = []; const outgoingClasses = []; const historyClasses = []; const futureClasses = [];
              
                const monthlyData = [];
                for (let i = 0; i < 6; i++) {
                    const monthDate = new Date(target.getFullYear(), target.getMonth() + i, 1);
                    const monthEnd = new Date(target.getFullYear(), target.getMonth() + i + 1, 0);
                    const monthLabel = monthDate.toLocaleDateString('pt-BR', { month: 'short', year: '2-digit' });
                    let studentsInMonth = 0;

                    allInvolvedClasses.forEach(cls => {
                        const start = new Date(cls.inicio + 'T00:00:00');
                        const end = new Date(cls.termino + 'T00:00:00');
                        
                        let events = [ { date: start, inst: getCanonical(cls.instrutor1) } ];
                        if (cls.dataTransferencia && cls.instrutor2) events.push({ date: new Date(cls.dataTransferencia + 'T00:00:00'), inst: getCanonical(cls.instrutor2) });
                        if (cls.dataTransferencia2 && cls.instrutor3) events.push({ date: new Date(cls.dataTransferencia2 + 'T00:00:00'), inst: getCanonical(cls.instrutor3) });
                        events.sort((a,b) => a.date - b.date);
                        events.push({ date: end, inst: null });
                        
                        for (let j = 0; j < events.length - 1; j++) {
                            if (events[j].inst === instructorName) {
                                let instStart = events[j].date;
                                let instEnd = events[j+1].date;
                                if (instStart <= monthEnd && instEnd >= monthDate) {
                                    studentsInMonth += parseInt(cls.alunos) || 0;
                                }
                            }
                        }
                    });
                    monthlyData.push({ month: monthLabel, alunos: studentsInMonth });
                }

                allInvolvedClasses.forEach(cls => {
                    const start = new Date(cls.inicio + 'T00:00:00'); 
                    const end = new Date(cls.termino + 'T00:00:00'); 
                    
                    let d1 = cls.dataTransferencia && cls.dataTransferencia.length === 10 ? new Date(cls.dataTransferencia + 'T00:00:00') : null;
                    let d2 = cls.dataTransferencia2 && cls.dataTransferencia2.length === 10 ? new Date(cls.dataTransferencia2 + 'T00:00:00') : null;
                    
                    let isInst1 = getCanonical(cls.instrutor1) === instructorName;
                    let isInst2 = getCanonical(cls.instrutor2) === instructorName;
                    let isInst3 = getCanonical(cls.instrutor3) === instructorName;

                    let transfDate = d1; let transfDate2 = d2;
                    let instA = cls.instrutor2; let instB = cls.instrutor3;
                    let rawDate1 = cls.dataTransferencia; let rawDate2 = cls.dataTransferencia2;
                    let tagA = 'P1'; let tagB = 'P2';

                    if (d1 && d2 && d2 < d1) {
                        transfDate = d2; transfDate2 = d1;
                        instA = cls.instrutor3; instB = cls.instrutor2;
                        rawDate1 = cls.dataTransferencia2; rawDate2 = cls.dataTransferencia;
                        tagA = 'P2'; tagB = 'P1';
                        let temp2 = isInst2; isInst2 = isInst3; isInst3 = temp2;
                    }
                    if (target > end) { historyClasses.push({...cls, statusDetail: 'Finalizada'}); return; }
                    if (target < start) {
                        if (isInst1 || isInst2 || isInst3) {
                            let prev = isInst1 ? "Titular (Início)" : (isInst2 ? `Receberá ${tagA}` : `Receberá ${tagB}`);
                            futureClasses.push({...cls, statusDetail: `Abertura de nova turma (${prev})`});
                        }
                        return;
                    }
                    
                    if (isInst1) {
                         if (transfDate && target > transfDate) { historyClasses.push({...cls, statusDetail: `Repassado (${tagA})`});
                         } else { activeClasses.push({...cls, statusDetail: transfDate ? 'Titular (A Transf.)' : 'Titular'}); if (transfDate) outgoingClasses.push({...cls, transferNote: `Passará para ${instA} em ${formatDatePTBR(rawDate1)}`}); }
                    } else if (isInst2) {
                        if (transfDate) {
                            if (target < transfDate) { incomingClasses.push({...cls, transferNote: `Receberá de ${cls.instrutor1} em ${formatDatePTBR(rawDate1)}`});
                            } else if (transfDate2 && target > transfDate2) { historyClasses.push({...cls, statusDetail: `Repassado (${tagB})`});
                            } else { activeClasses.push({...cls, statusDetail: transfDate2 ? 'Sucessor 1 (A Transf.)' : 'Sucessor'}); if (transfDate2) outgoingClasses.push({...cls, transferNote: `Passará para ${instB} em ${formatDatePTBR(rawDate2)}`}); }
                        }
                    } else if (isInst3) {
                         if (transfDate2) {
                             if (target < transfDate2) { incomingClasses.push({...cls, transferNote: `Receberá de ${instA} em ${formatDatePTBR(rawDate2)}`});
                             } else { activeClasses.push({...cls, statusDetail: 'Sucessor Final'}); }
                         }
                    }
                });

                substitutions.forEach(sub => {
                    if (getCanonical(sub.instrutorSubstituto) === instructorName) {
                        const subStart = new Date(sub.dataInicio + 'T00:00:00'); const subEnd = new Date(sub.dataFim + 'T00:00:00');
                        if (target >= subStart && target <= subEnd) {
                            const originalClass = data.find(d => String(d.id) === String(sub.turmaId));
                            if (originalClass) {
                                activeClasses.push({ ...originalClass, isSubstitution: true, subDataInicio: sub.dataInicio, subDataFim: sub.dataFim, statusDetail: `🔄 Cobrindo ${sub.instrutorAusente} até ${formatDatePTBR(sub.dataFim)}`, obs: sub.motivo });
                            }
                        }
                    }
                });
              
                activeClasses.sort((a,b) => new Date(a.inicio) - new Date(b.inicio)); 
                return { ...fullProfile, monthlyData, organized: { activeClasses, incomingClasses, outgoingClasses, historyClasses, futureClasses } };
            };

            const openInstructorModal = (instPartial) => { const detailed = getOrganizedInstructorData(instPartial.nome); if (detailed) { setSelectedInstructorDetail(detailed); } };

            const handleOpenTransferModal = (turmaObj) => {
                setNewSub({ ...newSub, isDefinitive: false, turmaId: String(turmaObj.id), instrutorAusente: selectedInstructorDetail.nome });
                setIsSubModalOpen(true);
                setSelectedInstructorDetail(null); 
            };
            
            const handleCopyImportSummary = () => {
                if (!importSummaryModal) return;
                
                let txt = "RELATÓRIO DE PREENCHIMENTO ATIVO - S.G.T\n";
                txt += "===========================================\n\n";
                
                importSummaryModal.forEach(item => {
                    txt += `${item.isNewClass ? '🆕 ABERTURA DE NOVA TURMA' : 'AJUSTE EM TURMA EXISTENTE'}\n`;
                    txt += `Turma: ${item.turmaId}\n`;
                    txt += `Curso: ${item.curso} (${item.modalidade})\n`;
                    txt += `Intervenções em Vagas Abertas:\n`;
                    Object.entries(item.changes).forEach(([role, log]) => {
                        const nome = typeof log === 'object' ? log.nome : log;
                        const reason = typeof log === 'object' ? log.reason : 'Vaga preenchida';
                        txt += `  - ${role.replace('instrutor', 'Instrutor ')}: ${nome}\n    Motivo: ${reason}\n`;
                    });
                    txt += `-------------------------------------------\n`;
                });
                
                const textArea = document.createElement("textarea");
                textArea.value = txt;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showNotify("Relatório da copiado para a área de transferência!");
                } catch (err) {
                    showNotify("Erro ao copiar o texto.", "error");
                }
                document.body.removeChild(textArea);
            };

            const handleCopyEmail = (instructor, period) => {
                if (!instructor) return;
                const accessDate = new Date();
                accessDate.setHours(0, 0, 0, 0);
                const accessProfile = getOrganizedInstructorData(instructor.nome, accessDate);
                const org = (period && period.start && period.end)
                    ? instructor.organized
                    : (accessProfile ? accessProfile.organized : instructor.organized);
                if (!org) return;
                
                let actFiltered = [];
                let incFiltered = [];
                let outFiltered = [];
                let futFiltered = [];
                let histFiltered = [];
                let periodText = "";

                if (period && period.start && period.end) {
                    const pStart = new Date(period.start + '-01T00:00:00');
                    const pEnd = new Date(period.end + '-01T00:00:00');
                    pEnd.setMonth(pEnd.getMonth() + 1);
                    pEnd.setDate(0); 

                    if (period.start === period.end) {
                        periodText = ` no período de <b>${getMonthName(period.start)}</b>`;
                    } else {
                        periodText = ` no período de <b>${getMonthName(period.start)} a ${getMonthName(period.end)}</b>`;
                    }

                    const instName = getCanonical(instructor.nome);
                    const allInvolvedClasses = data.filter(d => getCanonical(d.instrutor1) === instName || getCanonical(d.instrutor2) === instName || getCanonical(d.instrutor3) === instName);

                    const parseDStr = (str, fallback) => (str && str.length === 10) ? str : fallback;

                    allInvolvedClasses.forEach(cls => {
                        const dInicio = parseDStr(cls.inicio, '1970-01-01');
                        const dTermino = parseDStr(cls.termino, '2099-12-31');
                        const dTransf1 = parseDStr(cls.dataTransferencia, null);
                        const dTransf2 = parseDStr(cls.dataTransferencia2, null);

                        let slices = [];
                        if (getCanonical(cls.instrutor1) === instName) {
                            slices.push({
                                start: dInicio, end: dTransf1 || dTermino,
                                isTransfOut: !!dTransf1, transfOutDate: dTransf1, transfOutTo: cls.instrutor2,
                                isTransfIn: false, roleName: 'Titular'
                            });
                        }
                        if (getCanonical(cls.instrutor2) === instName) {
                            slices.push({
                                start: dTransf1 || dInicio, end: dTransf2 || dTermino,
                                isTransfIn: !!dTransf1, transfInDate: dTransf1, transfInFrom: cls.instrutor1,
                                isTransfOut: !!dTransf2, transfOutDate: dTransf2, transfOutTo: cls.instrutor3,
                                roleName: 'Sucessor 1'
                            });
                        }
                        if (getCanonical(cls.instrutor3) === instName) {
                            slices.push({
                                start: dTransf2 || dTransf1 || dInicio, end: dTermino,
                                isTransfIn: !!dTransf2, transfInDate: dTransf2, transfInFrom: cls.instrutor2 || cls.instrutor1,
                                isTransfOut: false, roleName: 'Sucessor Final'
                            });
                        }

                        slices.forEach(slice => {
                            const sDate = new Date(slice.start + 'T00:00:00');
                            const eDate = new Date(slice.end + 'T00:00:00');

                            if (sDate <= pEnd && eDate >= pStart) {
                                let clonedCls = { ...cls };
                                
                                const tInDate = slice.isTransfIn ? new Date(slice.transfInDate + 'T00:00:00') : null;
                                const tOutDate = slice.isTransfOut ? new Date(slice.transfOutDate + 'T00:00:00') : null;

                                 const hasTransferInPeriod = tInDate && tInDate >= pStart && tInDate <= pEnd;
                                 const hasTransferOutPeriod = tOutDate && tOutDate >= pStart && tOutDate <= pEnd;
                                 const transferInIsFuture = tInDate && tInDate > accessDate;
                                 const transferOutIsFuture = tOutDate && tOutDate > accessDate;

                                 if (hasTransferInPeriod && transferInIsFuture) {
                                     clonedCls.transferNote = `Receberá de ${slice.transfInFrom} em ${formatDatePTBR(slice.transfInDate)}`;
                                     if (hasTransferOutPeriod && transferOutIsFuture) clonedCls.transferNote += ` | Repassará p/ ${slice.transfOutTo} em ${formatDatePTBR(slice.transfOutDate)}`;
                                     incFiltered.push(clonedCls);
                                 } else if (hasTransferOutPeriod && transferOutIsFuture) {
                                     clonedCls.transferNote = `Passará para ${slice.transfOutTo} em ${formatDatePTBR(slice.transfOutDate)}`;
                                     outFiltered.push(clonedCls);
                                 } else {
                                     clonedCls.statusDetail = tOutDate && tOutDate <= accessDate
                                         ? `Já repassada em ${formatDatePTBR(slice.transfOutDate)}`
                                         : (tInDate && tInDate <= accessDate
                                             ? `Recebida em ${formatDatePTBR(slice.transfInDate)}`
                                             : slice.roleName);
                                     actFiltered.push(clonedCls);
                                 }
                            }
                        });
                    });

                    substitutions.forEach(sub => {
                        if (getCanonical(sub.instrutorSubstituto) === instName) {
                            const subS = new Date(sub.dataInicio + 'T00:00:00');
                            const subE = new Date(sub.dataFim + 'T00:00:00');
                            if (subS <= pEnd && subE >= pStart) {
                                const originalClass = data.find(d => String(d.id) === String(sub.turmaId));
                                if (originalClass) {
                                    actFiltered.push({ ...originalClass, isSubstitution: true, statusDetail: `🔄 Cobrindo ${sub.instrutorAusente} até ${formatDatePTBR(sub.dataFim)}`, obs: sub.motivo });
                                }
                            }
                        }
                    });

                    const uniqueById = (arr) => Array.from(new Map(arr.map(a => [a.id, a])).values());
                    actFiltered = uniqueById(actFiltered).sort((a,b) => new Date(a.inicio) - new Date(b.inicio));
                    incFiltered = uniqueById(incFiltered).sort((a,b) => new Date(a.inicio) - new Date(b.inicio));
                    outFiltered = uniqueById(outFiltered).sort((a,b) => new Date(a.inicio) - new Date(b.inicio));
                    
                    futFiltered = []; 
                    histFiltered = [];

                } else {
                    actFiltered = [...org.activeClasses];
                    incFiltered = [...org.incomingClasses];
                    outFiltered = [...org.outgoingClasses];
                    futFiltered = [...org.futureClasses];
                    histFiltered = [...org.historyClasses];
                }

                // Resumo operacional: não inclui turmas cujo término já passou.
                const isFinishedForSummary = (turma) => {
                    const endStr = safeString(turma && turma.termino);
                    return endStr.length === 10 && new Date(endStr + 'T23:59:59') < accessDate;
                };
                const onlyOpenClasses = (arr) => (arr || []).filter(turma => !isFinishedForSummary(turma));
                actFiltered = onlyOpenClasses(actFiltered);
                incFiltered = onlyOpenClasses(incFiltered);
                outFiltered = onlyOpenClasses(outFiltered);
                futFiltered = onlyOpenClasses(futFiltered);
                histFiltered = [];

                // NOVO: Aplica o filtro de Analista caso tenha sido selecionado!
                if (period && period.analista) {
                    const filterFn = (arr) => arr.filter(t => normalizeText(t.analista) === normalizeText(period.analista));
                    actFiltered = filterFn(actFiltered);
                    incFiltered = filterFn(incFiltered);
                    outFiltered = filterFn(outFiltered);
                    futFiltered = filterFn(futFiltered);
                    histFiltered = filterFn(histFiltered);
                    periodText += `<br/><span style="color: #4f46e5; font-size: 11px;">🎯 Filtro Aplicado: Apenas turmas sob responsabilidade de <b>${period.analista}</b></span>`;
                }

                let html = `<div style="font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; color: #333333; line-height: 1.4;">`;
                html += `<p style="margin-bottom: 12px;">Prezado(a) Instrutor(a) <strong style="color: #1e3a8a; font-size: 15px;">${safeString(instructor.nome)}</strong>,<br/>Segue o panorama atualizado das suas distribuições no sistema${periodText}:</p>`;

                const buildBlock = (title, colorHex, bgColor, classes, infoType) => {
                    if (classes.length === 0) return '';
                    let block = `<div style="margin-bottom: 12px; border: 1px solid #e5e7eb; border-radius: 6px; overflow: hidden;">`;
                    block += `<div style="background-color: ${bgColor}; padding: 6px 12px; border-bottom: 2px solid ${colorHex};">`;
                    block += `<h3 style="margin: 0; color: ${colorHex}; font-size: 13px; text-transform: uppercase;">${title} (${classes.length})</h3></div>`;
                    
                    block += `<table style="width: 100%; border-collapse: collapse; background-color: #ffffff;">`;
                    classes.forEach((t, index) => {
                        let info = infoType === 'status' ? t.statusDetail : (infoType === 'transfer' ? t.transferNote : (infoType === 'opening' ? `Abertura em ${formatDatePTBR(t.inicio)}` : t.statusDetail));
                        let borderStyle = index < classes.length - 1 ? 'border-bottom: 1px solid #f3f4f6;' : '';
                        
                        block += `<tr>
                            <td style="padding: 6px 12px; ${borderStyle} width: 60%; vertical-align: middle;">
                                <div style="font-weight: bold; font-size: 13px; color: #1f2937; margin-bottom: 2px;">Turma ${safeString(t.id)}</div>
                                <div style="color: #6b7280; font-size: 11px;">${safeString(t.curso)} (${safeString(t.modalidade)})</div>
                            </td>
                            <td style="padding: 6px 12px; ${borderStyle} text-align: right; width: 40%; vertical-align: middle;">
                                <div style="display: inline-block; background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; color: ${colorHex}; margin-bottom: 3px;">${info}</div>
                                <div style="font-size: 10px; color: #4b5563;">Início: <b>${formatDatePTBR(t.inicio)}</b><br/>Término: <b>${formatDatePTBR(t.termino)}</b></div>
                            </td>
                        </tr>`;
                    });
                    block += `</table></div>`;
                    return block;
                };

                html += buildBlock('📌 Turmas Atuais (Em Vigência)', '#1d4ed8', '#eff6ff', actFiltered, 'status'); 
                html += buildBlock('📥 Turmas A Receber', '#c2410c', '#fff7ed', incFiltered, 'transfer'); 
                html += buildBlock('📤 Turmas A Repassar', '#047857', '#ecfdf5', outFiltered, 'transfer'); 
                html += buildBlock('🆕 Abertura de Novas Turmas (Agendadas)', '#4338ca', '#eef2ff', futFiltered, 'opening'); 
                
                if (actFiltered.length === 0 && incFiltered.length === 0 && outFiltered.length === 0 && futFiltered.length === 0 && histFiltered.length === 0) {
                    html += `<div style="padding: 15px; border: 1px dashed #cbd5e1; border-radius: 6px; background-color: #f8fafc; text-align: center; color: #64748b; font-size: 12px; margin-bottom: 12px;">Nenhuma turma vinculada a você ativa ou prevista para este filtro/período.</div>`;
                }

                html += `<p style="margin-top: 15px; font-size: 11px; color: #6b7280; border-top: 1px solid #e5e7eb; padding-top: 10px;">Atenciosamente,<br/><strong style="color: #374151;">Equipe de Gestão de Turmas - Senac PR</strong></p>`;
                html += `</div>`;

                const dummyElement = document.createElement('span');
                dummyElement.textContent = "Copiando...";
                document.body.appendChild(dummyElement);

                const selection = window.getSelection();
                const range = document.createRange();
                range.selectNodeContents(dummyElement);
                selection.removeAllRanges();
                selection.addRange(range);

                const clipboardListener = function(e) {
                    e.preventDefault();
                    e.clipboardData.setData('text/html', html);
                    e.clipboardData.setData('text/plain', "Resumo de Turmas copiado para colar no Outlook.");
                };

                document.addEventListener('copy', clipboardListener);

                try {
                    const ok = document.execCommand('copy');
                    if (ok) {
                        showNotify("Resumo Visual Enxuto copiado! Abra o Outlook e pressione Ctrl+V.");
                    } else {
                        throw new Error("Copy command failed");
                    }
                } catch (err) {
                    showNotify("O navegador bloqueou a cópia formatada. Tente novamente.", "error");
                } finally {
                    document.removeEventListener('copy', clipboardListener);
                    selection.removeAllRanges();
                    document.body.removeChild(dummyElement);
                }
            };

            const exportReport = (dataToExport, name) => { 
                try { 
                    let finalDataForExcel = [];

                    // 1. Se for o Relatório Geral
                    if (name.includes('geral')) {
                        // Mapeamento EXATO e blindado. A ordem aqui é a ordem que sai no Excel.
                        finalDataForExcel = dataToExport.map(row => ({
                            "Turma": safeString(row.id),
                            "Modalidade": safeString(row.modalidade),
                            "Curso": safeString(row.curso),
                            "Analista": safeString(row.analista),
                            "Alunos": parseInt(row.alunos) || 0,
                            "Início": formatDatePTBR(row.inicio),
                            "Término": formatDatePTBR(row.termino),
                            "Passagem 1": formatDatePTBR(row.dataTransferencia),
                            "Passagem 2": formatDatePTBR(row.dataTransferencia2),
                            "Instrutor 1": safeString(row.instrutor1),
                            "Instrutor 2": safeString(row.instrutor2),
                            "Instrutor 3": safeString(row.instrutor3),
                            "Instrutor Atual": safeString(row.instrutorAtual),
                            "Situação": safeString(row.status || 'Ativa')
                        }));
                    } 
                    // Relatório de Substituições
                    else if (name.includes('subs')) {
                         finalDataForExcel = dataToExport.map(row => ({
                            "Turma": safeString(row.turmaId),
                            "Motivo/Obs": safeString(row.motivo),
                            "Instrutor Ausente": safeString(row.instrutorAusente),
                            "Instrutor Substituto": safeString(row.instrutorSubstituto),
                            "Data Início": formatDatePTBR(row.dataInicio),
                            "Data Fim": formatDatePTBR(row.dataFim),
                            "Definitiva?": row.isDefinitive ? "Sim" : "Não"
                         }));
                    } 
                    // 4. Se for o Histórico de Logs
                    else {
                         finalDataForExcel = dataToExport.map(row => ({
                            "Data/Hora": new Date(row.timestamp).toLocaleString('pt-BR'),
                            "ID Turma": safeString(row.classId),
                            "Tipo de Ação": safeString(row.type),
                            "Dado Anterior": safeString(row.before),
                            "Dado Novo": safeString(row.after)
                         }));
                    }

                    // Agora entregamos o dado limpo e em português para a biblioteca
                    const ws = XLSX.utils.json_to_sheet(finalDataForExcel); 
                    const wb = XLSX.utils.book_new(); 
                    XLSX.utils.book_append_sheet(wb, ws, "Relatório"); 
                    XLSX.writeFile(wb, `${name}.xlsx`); 
                    
                } catch (err) { 
                    console.error("Erro no Excel:", err);
                    showNotify("Erro ao exportar o arquivo excel.", "error");
                } 
            };
            
            const subDaysCount = useMemo(() => {
                if (!newSub.dataInicio || !newSub.dataFim || newSub.isDefinitive) return 0;
                const start = new Date(newSub.dataInicio); const end = new Date(newSub.dataFim);
                const diffTime = Math.abs(end - start);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1; 
                return diffDays > 0 ? diffDays : 0;
            }, [newSub.dataInicio, newSub.dataFim, newSub.isDefinitive]);

            const isCopyValid = emailPeriod.start && emailPeriod.end && emailPeriod.start <= emailPeriod.end;

            // Variáveis do relatório Estatístico (NOVO)
            const totalInstrutoresAtivos = dashboardInstructors.length;
            const totalAlunosGeral = dashboardInstructors.reduce((acc, inst) => acc + inst.totalAlunos, 0);
            const mediaAlunosPorInstrutor = totalInstrutoresAtivos > 0 ? Math.round(totalAlunosGeral / totalInstrutoresAtivos) : 0;
            // ===: PREENCHEDOR DE VAGAS COM CRONOLOGIA PERFEITA ===

                    // === O DESENHO DO SISTEMA COMEÇA AQUI ===
            return (
                <div className="min-h-screen bg-slate-100 flex flex-col pb-10">
                    <input type="file" ref={fileInputRef} className="hidden" onChange={handleFileUpload} />
                    {notification && (<div className={`custom-alert fade-in ${notification.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'} text-white`}>{notification.type === 'error' ? <Icons.Alert /> : <Icons.Check />}<span className="font-bold">{safeString(notification.msg)}</span></div>)}

                    <div className="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm header-bar no-print">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center gap-4"><img src="https://upload.wikimedia.org/wikipedia/commons/8/86/Senac_logo.svg" alt="Senac" className="h-10 w-auto" /><div className="border-l border-gray-300 pl-4 h-8 flex items-center"><h1 className="text-xl font-bold text-slate-800 tracking-tight">Portal da Supervisão</h1></div></div>
                            <div className="flex items-center gap-6">
                                <button onClick={handleFullBackupExport} className="px-3 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-bold text-xs flex gap-1 items-center shadow-lg transition border border-indigo-500 animate-pulse hover:animate-none"><Icons.Sync /> Backup</button>
                                {LOCAL_TEST_MODE && <span className="px-3 py-2 bg-amber-100 text-amber-800 border border-amber-200 rounded-lg font-bold text-xs uppercase tracking-wide">Modo Local</span>}
                                <div className="flex flex-col items-end">{isSaving ? (<div className="flex items-center gap-2 text-orange-500"><div className="loading-icon"><Icons.Refresh /></div><span className="text-xs font-bold uppercase tracking-wide">Salvando...</span></div>) : (<div className="flex items-center gap-1 text-green-600"><Icons.Check /><span className="text-xs font-bold uppercase tracking-wide">Dados Salvos (v126)</span></div>)}<span className="text-[10px] text-gray-400">{lastSaved ? `Sync: ${lastSaved.toLocaleTimeString()}` : 'Pronto'}</span></div>
                                
                                {/* BOTÕES DE AÇÃO PRINCIPAIS */}
                                <div className="flex gap-2">

                                    <button onClick={() => setIsSubModalOpen(true)} className="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-bold text-sm flex gap-2 items-center shadow-sm transition hover:scale-105"><Icons.Switch /> Transferir</button>
                                    <button onClick={() => setIsNewInstModalOpen(true)} className="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 font-bold text-sm flex gap-2 items-center shadow-sm transition hover:scale-105"><Icons.UserPlus /> Novo Instrutor</button>
                                    <button onClick={() => setIsFormOpen(true)} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-bold text-sm flex gap-2 items-center shadow-sm transition hover:scale-105"><Icons.Plus /> Nova Turma</button>
                                    
                                    {/* Botão de deslogar do sistema */}
                                    <button onClick={() => LOCAL_TEST_MODE ? showNotify("Modo local ativo: sem conexão com Firebase.", "success") : window.authMethods.signOut(window.auth)} className="ml-2 px-3 py-2 bg-slate-100 text-slate-500 rounded-lg hover:bg-red-50 hover:text-red-600 font-bold text-sm flex gap-1 items-center shadow-sm transition">Sair</button>
                                </div>
                            </div>
                        </div>
                        <div className="bg-slate-50 border-b border-gray-200 nav-bar">
                            <div className="max-w-7xl mx-auto px-4 flex gap-1 overflow-x-auto py-1">
                                <button onClick={() => {setActiveTab('dashboard'); setReportType('geral');}} className={`px-4 py-2 rounded-t-lg text-xs font-bold transition border-b-2 ${activeTab==='dashboard'?'border-blue-600 text-blue-900 bg-white':'border-transparent text-gray-500 hover:text-blue-600 hover:bg-white'}`}>Dashboard</button>
                                <button onClick={() => {setActiveTab('relatorios'); setReportType('geral');}} className={`px-4 py-2 rounded-t-lg text-xs font-bold transition border-b-2 ${activeTab==='relatorios' && reportType==='geral'?'border-blue-600 text-blue-900 bg-white':'border-transparent text-gray-500 hover:text-blue-600 hover:bg-white'}`}>Relatório Geral</button>
                                <button onClick={() => {setActiveTab('relatorios'); setReportType('subs');}} className={`px-4 py-2 rounded-t-lg text-xs font-bold transition border-b-2 ${activeTab==='relatorios' && reportType==='subs'?'border-blue-600 text-blue-900 bg-white':'border-transparent text-gray-500 hover:text-blue-600 hover:bg-white'}`}>Relatório Substituições</button>
                                <button onClick={() => {setActiveTab('relatorios'); setReportType('estatisticas');}} className={`px-4 py-2 rounded-t-lg text-xs font-bold transition border-b-2 ${activeTab==='relatorios' && reportType==='estatisticas'?'border-emerald-600 text-emerald-900 bg-emerald-50':'border-transparent text-gray-500 hover:text-emerald-600 hover:bg-emerald-50'}`}>Estatísticas e Médias</button>
                                <button onClick={() => {setActiveTab('relatorios'); setReportType('analisePeriodo');}} className={`px-4 py-2 rounded-t-lg text-xs font-bold transition border-b-2 ${activeTab==='relatorios' && reportType==='analisePeriodo'?'border-purple-600 text-purple-900 bg-purple-50':'border-transparent text-gray-500 hover:text-purple-600 hover:bg-purple-50'}`}>Análise por Período</button>
                                <button onClick={() => {setActiveTab('relatorios'); setReportType('logs');}} className={`px-4 py-2 rounded-t-lg text-xs font-bold transition border-b-2 ${activeTab==='relatorios' && reportType==='logs'?'border-purple-600 text-purple-900 bg-purple-50':'border-transparent text-gray-500 hover:text-purple-600 hover:bg-purple-50'}`}>Histórico</button>
                                <button onClick={installApp} className="px-3 py-1 text-purple-700 hover:bg-purple-50 border border-purple-200 rounded text-xs font-bold flex items-center gap-1 transition"><Icons.Download /> Instalar App</button>
                                <button onClick={restoreBackupPrompt} disabled={isSaving} className="px-3 py-1 text-indigo-700 hover:bg-indigo-50 border border-indigo-200 rounded text-xs font-bold flex items-center gap-1 transition disabled:opacity-50"><Icons.Download /> Restaurar backup</button>
                                <span title={syncDetail} className={`px-2 py-1 rounded text-[10px] font-black ${syncStatus==='saved'?'bg-green-100 text-green-700':syncStatus==='error'?'bg-red-100 text-red-700':'bg-amber-100 text-amber-800'}`}>{syncStatus==='saved'?'SALVO AUTOMATICAMENTE':!isOnline?'OFFLINE • SALVO NO PC':'SALVANDO AUTOMATICAMENTE'}</span>
                                {/* Botão de Limpar Banco */}
                                <button onClick={handleClearAllData} className="px-3 py-1 text-red-600 hover:bg-red-50 border border-red-200 rounded text-xs font-bold flex items-center gap-1 transition mr-2">
                                    <Icons.Trash /> Limpar Banco
                                </button>
                                {/* Botão de Importar que já existia */}
                                <button onClick={() => fileInputRef.current.click()} className="ml-auto px-3 py-1 text-emerald-600 hover:bg-emerald-50 border border-emerald-200 rounded text-xs font-bold flex items-center gap-1 transition">
                                    <Icons.Upload /> Importar Excel
                                </button>
                            </div>
                        </div>
                    </div>

                    <main className="max-w-7xl mx-auto w-full px-6 py-8 flex-1">
                        {false && totalSystemicAIAlerts > 0 && (
                            <button onClick={() => setAiAlertModal({ scope: 'system' })} className="fixed bottom-6 right-6 z-50 bg-purple-700 hover:bg-purple-800 text-white rounded-full shadow-2xl px-4 py-3 flex items-center gap-2 border-2 border-purple-300 no-print" title="Abrir central de alertas da IA">
                                <Icons.Robot /><span className="font-black text-xs">IA</span><span className="bg-white text-purple-800 rounded-full min-w-6 h-6 px-1 flex items-center justify-center text-[10px] font-black">{totalSystemicAIAlerts}</span>
                            </button>
                        )}
                        {activeTab === 'relatorios' ? (
                            <div className="fade-in bg-white p-6 rounded-xl shadow-sm border border-gray-200 printable-content">
                                {reportType === 'analisePeriodo' ? (
                                    <div className="space-y-7">
                                        <div className="rounded-2xl bg-gradient-to-r from-slate-900 via-purple-950 to-indigo-900 p-6 text-white shadow-xl"><h2 className="text-2xl font-black">Análise Estatística por Período</h2><p className="text-purple-200 text-sm mt-1">Turmas, alunos, cursos, analistas e instrutores em uma visão consolidada.</p></div>
                                        <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm no-print"><div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-3"><div><label className="input-label">Início</label><input type="date" className="input-field" value={statsPeriod.start} onChange={e=>updateStatsFilter('start',e.target.value)}/></div><div><label className="input-label">Fim</label><input type="date" className="input-field" value={statsPeriod.end} onChange={e=>updateStatsFilter('end',e.target.value)}/></div><div><label className="input-label">Analista</label><select className="input-field" value={statsPeriod.analyst} onChange={e=>updateStatsFilter('analyst',e.target.value)}><option value="">Todos</option>{statisticsAnalysis.analysts.map(x=><option key={x}>{x}</option>)}</select></div><div><label className="input-label">Curso</label><select className="input-field" value={statsPeriod.course} onChange={e=>updateStatsFilter('course',e.target.value)}><option value="">Todos</option>{statisticsAnalysis.courses.map(x=><option key={x}>{x}</option>)}</select></div><div><label className="input-label">Instrutor</label><select className="input-field" value={statsPeriod.instructor} onChange={e=>updateStatsFilter('instructor',e.target.value)}><option value="">Todos</option>{statisticsAnalysis.instructors.map(x=><option key={x}>{x}</option>)}</select></div></div><div className="flex flex-wrap gap-2 mt-4">{['Agendado','Ativo','Transferido','Finalizado'].map(st=><label key={st} className={`px-3 py-2 rounded-xl border text-xs font-bold flex items-center gap-2 ${statsPeriod.statuses[st]?'bg-purple-100 border-purple-300 text-purple-900':'bg-slate-50 border-slate-200 text-slate-400'}`}><input type="checkbox" checked={statsPeriod.statuses[st]} onChange={()=>setStatsPeriod(p=>({...p,statuses:{...p.statuses,[st]:!p.statuses[st]}}))}/>{st}<span className="bg-white rounded-full px-1.5 py-0.5 text-[9px]">{statisticsAnalysis.statusCounts[st] || 0}</span></label>)}</div></div>
                                        {(!statsPeriod.start||!statsPeriod.end)?<div className="bg-white border-2 border-dashed border-slate-200 rounded-2xl p-12 text-center text-slate-400">Selecione o período para gerar as análises.</div>:<>
                                        <section className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden"><div className="px-5 py-4 bg-lime-100 flex justify-between"><h3 className="font-black text-slate-900">Geral consolidado e turmas por analista</h3><button onClick={()=>copyStatisticsBlock('Geral consolidado e turmas por analista',['Analista','Turmas','Alunos','Instrutores atuais distintos','Turmas do analista'],[...statisticsAnalysis.summary.map(x=>[x.analista,x.turmas,x.alunos,x.instrutores,x.turmaIds.join(', ')]),['Total',statisticsAnalysis.totals.turmas,statisticsAnalysis.totals.alunos,statisticsAnalysis.totals.instructors,'']])} className="bg-white text-purple-700 px-3 py-1 rounded-lg text-xs font-bold shadow"><Icons.Copy/> Copiar</button></div><div className="overflow-x-auto"><table className="min-w-full comp-table"><thead><tr><th>Analista</th><th>Turmas</th><th>Alunos</th><th>Instrutores atuais distintos</th><th>Turmas do analista</th></tr></thead><tbody>{statisticsAnalysis.summary.map(x=><tr key={x.analista}><td className="font-black">{x.analista}</td><td>{x.turmas}</td><td>{x.alunos}</td><td className="font-bold">{x.instrutores}</td><td><div className="flex flex-wrap gap-1 max-w-xl">{x.turmaIds.map(id=><span key={id} className="inline-flex px-2 py-1 rounded-lg bg-purple-50 border border-purple-200 text-purple-800 text-[10px] font-black">{id}</span>)}</div></td></tr>)}<tr className="bg-slate-100 font-black"><td>Total</td><td>{statisticsAnalysis.totals.turmas}</td><td>{statisticsAnalysis.totals.alunos}</td><td>{statisticsAnalysis.totals.instructors}</td><td className="text-xs text-slate-500">Turmas detalhadas nas linhas acima</td></tr></tbody></table></div></section>
